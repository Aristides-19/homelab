server:
	port: 5335
	interface: 127.0.0.1
	do-ip4: yes
	prefer-ip4: yes
	do-udp: yes
	do-tcp: yes

	root-hints: "/var/lib/unbound/root.hints"
	
	access-control: 127.0.0.1/32 allow
	
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    harden-referral-path: no
    harden-below-nxdomain: yes
    
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    so-rcvbuf: 2m
    so-sndbuf: 2m
    neg-cache-size: 4m
	edns-buffer-size: 1232
	rrset-roundrobin: yes
	qname-minimisation: no
	cache-min-ttl: 300
	cache-max-ttl: 86400
	so-reuseport: yes
	msg-cache-slabs: 2
	rrset-cache-slabs: 2
	infra-cache-slabs: 2
	key-cache-slabs: 2
	
    verbosity: 1
    log-queries: no

    serve-expired: yes
    serve-expired-ttl: 86400
    qname-minimisation: yes
    prefetch: yes
    prefetch-key: yes
    minimal-responses: yes

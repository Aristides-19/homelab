apiVersion: v1
kind: Pod
metadata:
  name: komga
spec:
  containers:
    - name: server
      image: ghcr.io/gotson/komga:1.x
      envFrom:
        - configMapRef:
            name: env
      ports:
        - containerPort: 25600
          hostPort: 25600
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: 25600
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 5
      volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /data
      resources:
        limits:
          memory: "1Gi"
        requests:
          memory: "256Mi"

  volumes:
    - name: config
      hostPath:
        path: /data/komga/config
        type: DirectoryOrCreate
    - name: data
      hostPath:
        path: /data/komga/data
        type: DirectoryOrCreate


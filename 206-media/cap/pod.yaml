apiVersion: v1
kind: Pod
metadata:
  name: cap
spec:
  containers:
    - name: web
      image: ghcr.io/capsoftware/cap-web:latest
      env:
        - name: NODE_OPTIONS
          value: "--max-old-space-size=384"
      envFrom:
        - configMapRef:
            name: env
      ports:
        - containerPort: 3000
          hostPort: 3000
      livenessProbe:
        exec:
          command:
            - wget
            - --no-verbose
            - --tries=1
            - --spider
            - http://127.0.0.1:3000/
        initialDelaySeconds: 30
        periodSeconds: 15
        timeoutSeconds: 5
      resources:
        limits:
          memory: "512Mi"
        requests:
          memory: "256Mi"

    - name: media-server
      image: localhost/cap-media-server:latest
      env:
        - name: PORT
          value: "3456"
      envFrom:
        - configMapRef:
            name: env
      livenessProbe:
        exec:
          command:
            - bun
            - -e
            - "const response = await fetch('http://127.0.0.1:3456/health'); process.exit(response.ok ? 0 : 1)"
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5

    - name: db
      image: docker.io/library/mysql:8.0
      env:
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: env
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: env
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: env
              key: MYSQL_PASSWORD
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: env
              key: MYSQL_ROOT_PASSWORD
      args:
        - --max_connections=50
        - --default-authentication-plugin=mysql_native_password
        - --character-set-server=utf8mb4
        - --collation-server=utf8mb4_unicode_ci
        - --performance_schema=OFF
        - --innodb_buffer_pool_size=32M
        - --innodb_log_buffer_size=1M
        - --binlog_cache_size=16K
        - --key_buffer_size=8M
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - mysqladmin ping -h localhost -u "$MYSQL_USER" -p"$MYSQL_PASSWORD"
        initialDelaySeconds: 20
        periodSeconds: 10
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      resources:
        limits:
          memory: "250Mi"
        requests:
          memory: "128Mi"

    - name: minio
      image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      args: ["server", "/data", "--console-address", ":9001"]
      env:
        - name: MINIO_ROOT_USER
          valueFrom:
            configMapKeyRef:
              name: env
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: env
              key: MINIO_ROOT_PASSWORD
        - name: MINIO_API_CORS_ALLOW_ORIGIN
          value: "*"
      ports:
        - containerPort: 9000
          hostPort: 9000
        - containerPort: 9001
          hostPort: 9001
      livenessProbe:
        httpGet:
          path: /minio/health/live
          port: 9000
        initialDelaySeconds: 15
        periodSeconds: 15
      volumeMounts:
        - name: minio-data
          mountPath: /data

  volumes:
    - name: mysql-data
      hostPath:
        path: /data/cap/mysql
        type: DirectoryOrCreate
    - name: minio-data
      hostPath:
        path: /data/cap/minio
        type: DirectoryOrCreate

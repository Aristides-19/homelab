apiVersion: v1
kind: ConfigMap
metadata:
  name: env.gpt
data:
  PAPERLESS_BASE_URL: "http://localhost:8000"
  PAPERLESS_API_TOKEN: ""

  GOOGLEAI_API_KEY: ""

  LLM_PROVIDER: "googleai"
  LLM_LANGUAGE: "Spanish"
  LLM_MODEL: "gemini-3.1-flash-lite-preview"
  LLM_REQUESTS_PER_MINUTE: "15"

  OCR_PROVIDER: "llm"
  VISION_LLM_PROVIDER: "googleai"
  VISION_LLM_MODEL: "gemma-4-26b-a4b-it"
  VISION_LLM_REQUESTS_PER_MINUTE: "15"
  OCR_PROCESS_MODE: "image"
  IMAGE_MAX_RENDER_DPI: "150"
  IMAGE_MAX_PIXEL_DIMENSION: "2000"
  IMAGE_MAX_TOTAL_PIXELS: "4000000"
  IMAGE_MAX_FILE_BYTES: "10485760"

  TOKEN_LIMIT: "5000"
  LOG_LEVEL: "info"


apiVersion: v1
kind: Pod
metadata:
  name: dozzle-agent
spec:
  containers:
    - name: server
      image: ghcr.io/amir20/dozzle:v10
      envFrom:
        - configMapRef:
            name: env
      args:
        - agent
      ports:
        - containerPort: 7007
          hostPort: 7007
      volumeMounts:
        - name: podman-socket
          mountPath: /var/run/docker.sock
          readOnly: true

  volumes:
    - name: podman-socket
      hostPath:
        path: /run/podman/podman.sock
        type: Socket

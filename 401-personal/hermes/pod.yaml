apiVersion: v1
kind: Pod
metadata:
  name: hermes
spec:
  containers:
    - name: gateway
      image: docker.io/nousresearch/hermes-agent:v0.23.0
      ports:
        - containerPort: 8642
          hostPort: 8642
        - containerPort: 9119
          hostPort: 9119
      args: ["gateway", "run"]
      env:
        - name: HERMES_HOME
          value: /home/hermes/.hermes
        - name: UV_CACHE_DIR
          value: /home/hermes/.hermes/cache/uv
        - name: TMPDIR
          value: /home/hermes/.hermes/tmp
        - name: MALLOC_ARENA_MAX
          value: "2"
      envFrom:
        - configMapRef:
            name: env
      volumeMounts:
        - name: home
          mountPath: /home/hermes/.hermes
      resources:
        limits:
          memory: 1024Mi
        requests:
          memory: 256Mi

  volumes:
    - name: home
      hostPath:
        path: /data/hermes/dev
        type: DirectoryOrCreate

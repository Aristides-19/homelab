apiVersion: v1
kind: Pod
metadata:
  name: hermes
spec:
  containers:
    - name: gateway
      image: docker.io/nousresearch/hermes-agent:v2026.7.7
      ports:
        - containerPort: 9119
          hostPort: 9119
      args: ["gateway", "run"]
      env:
        - name: HERMES_HOME
          value: /home/hermes/.hermes
        - name: UV_CACHE_DIR
          value: /home/hermes/.hermes/cache/uv
        - name: TMPDIR
          value: /workspace/obsidian/.obsidian/tmp
        - name: MALLOC_ARENA_MAX
          value: "2"
      envFrom:
        - configMapRef:
            name: env
      volumeMounts:
        - name: home
          mountPath: /home/hermes/.hermes
        - name: obsidian
          mountPath: /workspace/obsidian
      resources:
        limits:
          memory: 1024Mi
        requests:
          memory: 256Mi

    - name: proxy
      image: localhost/agy-proxy:latest
      ports:
        - containerPort: 9090
          hostPort: 9090
      envFrom:
        - configMapRef:
            name: env.proxy
      volumeMounts:
        - name: home
          mountPath: /root/.config/antigravity-proxy
          subPath: .agy-proxy
      resources:
        limits:
          memory: 256Mi
        requests:
          memory: 64Mi

  volumes:
    - name: home
      hostPath:
        path: /data/hermes/dev
        type: DirectoryOrCreate
    - name: obsidian
      hostPath:
        path: /data/obsidian/vaults/dev
        type: Directory

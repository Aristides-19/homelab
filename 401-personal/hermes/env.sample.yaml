apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  # UID/GID Alignment for unprivileged containers
  HERMES_UID: "1993"
  HERMES_GID: "1993"
  
  # Gateway Server Configuration

  # Dashboard/Webapp sign-in (gateway serves the Webapp on webapp.port,
  # configured in config.yaml: webapp.enabled / host / port / public_url).
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: ""
  HERMES_DASHBOARD_SESSION_TOKEN: ""
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ""
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""

  # Server
  TZ: "America/Caracas"

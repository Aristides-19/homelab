apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  # UID/GID Alignment for unprivileged containers
  HERMES_UID: "1993"
  HERMES_GID: "1993"
  WANTED_UID: "1993"
  WANTED_GID: "1993"
  HERMES_WRITE_SAFE_ROOT: "/workspace"

  # WebUI Authentication
  HERMES_WEBUI_HOST: "0.0.0.0"
  HERMES_WEBUI_PORT: "8787"
  HERMES_WEBUI_PASSWORD: ""
  HERMES_WEBUI_STATE_DIR: "/home/hermeswebui/.hermes/webui"
  
  # WebUI Gateway Routing
  HERMES_WEBUI_CHAT_BACKEND: "gateway"
  HERMES_API_URL: "http://127.0.0.1:8642"
  HERMES_WEBUI_GATEWAY_BASE_URL: "http://127.0.0.1:8642"
  HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
  HERMES_WEBUI_GATEWAY_API_KEY: "MIN_8_CHARS"
  
  # Agent / Gateway Server Configuration
  HERMES_DASHBOARD: "0"
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "127.0.0.1"
  API_SERVER_PORT: "8642"
  API_SERVER_KEY: "SAME_SECRET_KEY_AS_ABOVE"
  
  # Skills
  OBSIDIAN_VAULT_PATH: "/workspace/obsidian"
  WIKI_PATH: "/workspace/obsidian" # Just for WebUI stats

  # Server
  TZ: "America/Caracas"

  # Obscura Plugin
  OBSCURA_CDP_URL: "http://127.0.0.1:9222"

  # Proxy
  ANTHROPIC_BASE_URL: "http://127.0.0.1:9090/v1"
  ANTHROPIC_API_KEY: ""

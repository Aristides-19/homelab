model:
  default: gemini-pro-agent
  provider: anthropic
  base_url: http://127.0.0.1:9090/v1
agent:
  max_turns: 60
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  cloud_provider: obscura
  use_gateway: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.4
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
prompt_caching:
  cache_ttl: 1h
auxiliary:
  vision:
    provider: gemini
    model: gemini-3.1-flash-lite
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  loading: lazy
  creation_nudge_interval: 15
  disabled:
    - dogfood
    - yuanbao
    - claude-code
    - codex
    - apple
    - computer-use
    - data-science

apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  # Initial Admin User (only on first start)
  TUDUDI_USER_EMAIL: "admin@change.me"
  TUDUDI_USER_PASSWORD: "change-me-please"

  TUDUDI_SESSION_SECRET: "CHANGE_ME"

  # Networking & Reverse Proxy
  BASE_URL: "https://todo.change.me"
  TUDUDI_ALLOWED_ORIGINS: "https://todo.change.me"
  TUDUDI_TRUST_PROXY: "true"
  COOKIE_SECURE: "auto"
  UPGRADE_INSECURE_REQUESTS: "true"

  # Storage paths inside container
  TUDUDI_UPLOAD_PATH: "/app/uploads"

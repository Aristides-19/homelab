apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  # ── Identity (MUST match the URL people browse to) ────────────────────────
  # RP_ID is a bare hostname — no scheme, no port, no path. Passkeys are bound to
  # it, so changing it later invalidates every passkey created before.
  RP_ID: "gym.change.me"
  ORIGIN: "https://gym.change.me"
  RP_NAME: "openGym"
  # How long a browser sign-in / paired phone lasts, in days.
  SESSION_DAYS: "90"

  # ── Multi-user ────────────────────────────────────────────────────────────
  # Was "1" until the owner's profile existed and held admin; turned off on
  # purpose. Left on, an instance whose profiles are all deleted counts as
  # fresh again and would hand admin to whoever signs up next.
  FIRST_USER_ADMIN: "0"
  # Comma-separated account ids (Settings → Account → Account ID) of further
  # admins. The first profile is already marked "admin": true in db.json.
  # ADMIN_UIDS: ""
  # New profiles need an invite code, generated from the admin dashboard.
  # Safe only because an admin exists: with no profiles and no admin, nobody
  # could generate the first code. Existing accounts keep working.
  INVITE_ONLY: "1"
  # No "Continue without account". Guest mode keeps everything in that browser
  # and never talks to the server — no account, no sync, nothing in the admin
  # dashboard — so on an instance for a known set of people it is a door that
  # leads nowhere useful. Anyone already inside as a guest is returned to the
  # login screen; their data stays in that browser.
  ALLOW_GUEST: "0"
  # Sign-in / create-profile screens, and every profile that never picked a
  # language, start in this one.
  DEFAULT_LANG: "es"

  # ── Password sign-in (fallback next to passkeys) ──────────────────────────
  # Needed for phones without a passkey and for recovery (admin hands out a
  # one-time reset code). Passkeys stay the default and the safer choice.
  PASSWORD_LOGIN: "1"
  # The visitor address is read from CF-Connecting-IP / X-Forwarded-For only
  # while this is on, for the throttle and the activity log.
  TRUST_PROXY: "1"

  # ── Activity log (admin dashboard) ────────────────────────────────────────
  AUDIT_LOG: "1"
  AUDIT_MAX: "5000"
  AUDIT_DAYS: "90"
  # "off" (default, no addresses at all) | "net" (203.0.113.0/24) | "full"
  AUDIT_IP: "net"

  # ── Photos and videos of custom exercises ─────────────────────────────────
  MEDIA_UPLOADS: "1"
  MEDIA_QUOTA_MB: "200"          # per profile, 0 = no cap
  MEDIA_IMAGE_MAX_MB: "2"
  MEDIA_GIF_MAX_MB: "8"
  MEDIA_VIDEO_MAX_MB: "40"
  MEDIA_VIDEO_MAX_SEC: "60"
  MEDIA_GC_GRACE_DAYS: "14"
  MEDIA_UPLOADS_PER_HOUR: "600"
  MEDIA_MIN_FREE_MB: "512"
  MEDIA_UPLOAD_MAX: "48m"        # nginx (web) cap on one upload; keep above MEDIA_VIDEO_MAX_MB

  # ── Notifications ─────────────────────────────────────────────────────────
  # Web Push (browser / installed PWA) works out of the box: VAPID keys are
  # generated into ./data/vapid.json on first run, nothing to paste here.
  # The native phone app does not use Web Push at all - it schedules local
  # notifications on the device, no FCM, no APNs, no server involved - so this
  # only ever affects people using openGym in a browser.
  #
  # The subject is the contact identifier the push service (FCM, Mozilla,
  # Apple) stores next to your subscription; no mail is ever sent to it. It has
  # to be a real mailto: address or an https URL - a made-up mailbox is worse
  # than none, because it looks configured and reaches nobody.
  #
  # Left unset on purpose: the API falls back to ORIGIN (https://gym.change.me
  # here), which is both valid for the protocol and an honest address for this
  # instance. Set it to a mailto: only for a mailbox that actually exists.
  # VAPID_SUBJECT: "mailto:you@example.com"

  # ── AI Coach ──────────────────────────────────────────────────────────────
  # Off until an admin turns it on in the dashboard and connects a provider
  # (Anthropic / OpenAI / Gemini / any OpenAI-compatible endpoint incl. a local
  # Ollama over http). No credentials belong in this file: they are stored
  # encrypted in ./data/coach.json. Kill switch that outranks the admin toggle:
  # COACH_DISABLED: "1"
  # COACH_JOB_TIMEOUT_MS: "1500000"

  # ── Stack wiring (prebuilt images) ────────────────────────────────────────
  # Port the API listens on; web proxies /api to it.
  PORT: "3000"
  # Where the API stores db.json, state-<uid>.json, secret, audit.log, uploads/.
  DATA_DIR: "/data"
  # Port nginx listens on inside web. Podman rootless will not bind < 1024, so
  # this is 8080 and 3010 is published instead of 80.
  NGINX_PORT: "8080"
  # What web proxies /api to. 127.0.0.1 because api and web share the pod's
  # network namespace; the compose file's service name "api" has no DNS entry
  # inside a pod. Use the container name only if you split them into a pod.
  BACKEND: "127.0.0.1"
  # Only used when BACKEND is a name: systemd-resolved inside the LXC. Kept set
  # because an unreachable resolver does not fail fast, every /api request
  # would hang until it times out.
  RESOLVER: "127.0.0.53"
  # Empty = site root. Only set for a proxy that passes a subpath through.
  BASE_PATH: ""
  # Behind Cloudflare Tunnel, so the real visitor address reaches the audit log
  # and the sign-in throttle. Safe only because Cloudflare overwrites this
  # header; leave it empty on any other setup.
  CF_CONNECTING_IP: "$http_cf_connecting_ip"

apiVersion: v1
kind: Pod
metadata:
  name: openbot
spec:
  containers:
    - name: openbot
      image: ghcr.io/nightly-labs/openbot:0.56.0
      envFrom:
        - configMapRef:
            name: env
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        limits:
          memory: 2Gi
        requests:
          memory: 512Mi

  volumes:
    - name: data
      hostPath:
        path: /data/openbot
        type: DirectoryOrCreate

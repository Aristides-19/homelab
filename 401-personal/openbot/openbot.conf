# Container settings for OpenBot only.
#
# Quadlet .kube units cannot express --security-opt, --shm-size or --stop-timeout,
# and podman kube play has no flags for them. This module gives the requirements
# from docs/docker.md to the containers of this pod alone, and leaves the other
# services of the LXC untouched.
#
#   seccomp_profile  The Electron sandbox makes user namespaces. The default
#                    profile refuses them. With the wrong profile the container
#                    still starts but its browser sandbox is refused.
#   shm_size         Chromium uses shared memory. The default of 64 MB is too small.
#
# stop_timeout is a libpod engine setting, not a container one, so it goes in
# [engine] below.

[containers]
seccomp_profile = "/opt/openbot/seccomp.json"
shm_size = "1g"

[engine]
stop_timeout = 60

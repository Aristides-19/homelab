arch: amd64
cores: 2
features: nesting=1
hostname: gateway
memory: 512
mp0: /opt/homelab/100-gateway/caddy,mp=/etc/caddy
mp1: /opt/homelab/100-gateway/tailscale,mp=/opt/tailscale
mp2: /opt/homelab/100-gateway/adguard,mp=/opt/adguard
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.168.0.1,hwaddr=BC:24:11:58:B2:2C,ip=192.168.0.3/24,type=veth
net1: name=eth1,bridge=vmbr1,hwaddr=BC:24:11:63:B8:7C,ip=10.0.0.1/16,type=veth
onboot: 1
ostype: debian
rootfs: local:100/vm-100-disk-0.raw,size=4G
startup: order=1,up=0
swap: 512
tags: dns;reverse-proxy;tunnel;vpn
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,optional,create=file

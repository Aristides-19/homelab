arch: amd64
cores: 1
features: nesting=1
hostname: monitor
memory: 512
mp0: /opt/homelab/200-monitor/uptime-kuma,mp=/opt/uptime-kuma
mp1: /opt/homelab/200-monitor/dozzle,mp=/opt/dozzle
net0: name=eth0,bridge=vmbr1,gw=10.0.0.1,hwaddr=BC:24:11:2A:61:69,ip=10.0.2.0/16,type=veth
onboot: 1
ostype: debian
rootfs: local:200/vm-200-disk-0.raw,size=4G
startup: order=7,up=15
swap: 512
tags: uptime
unprivileged: 1

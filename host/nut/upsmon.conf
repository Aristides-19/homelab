# Network UPS Tools: upsmon.conf
# Backed up from /etc/nut/upsmon.conf

# Monitor the local UPS
MONITOR cdp_ups@localhost 1 upsmon_user REPLACE_WITH_SECURE_PASSWORD primary

# Default daemon settings
MINSUPPLIES 1               # Min active UPSs needed to keep system online
SHUTDOWNCMD "/sbin/shutdown -h +0" # Command to safely turn off the host system
POLLFREQ 5                  # Query interval (seconds) under normal AC power
POLLFREQALERT 5             # Query interval (seconds) under battery power
HOSTSYNC 15                 # Wait time (seconds) for secondary systems to disconnect
DEADTIME 15                 # Max time (seconds) without server updates before UPS is declared dead
POWERDOWNFLAG "/etc/killpower" # Flag file created to signal the UPS to cut output power
OFFDURATION 30              # Wait time (seconds) before acting on temporary admin OFF status
RBWARNTIME 43200            # Alert interval (seconds) for replace battery warnings (12h)
NOCOMMWARNTIME 300          # Alert interval (seconds) for lost connection warnings (5m)
FINALDELAY 5                # Delay (seconds) after shutdown warning and before running SHUTDOWNCMD

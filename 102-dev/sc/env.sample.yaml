apiVersion: v1
kind: ConfigMap
metadata:
  name: env
data:
  DATABASE_PATH: "/app/data/data.sqlite"

  # API on PORT, dashboard on WEB_PORT. Same names as `pnpm dev`.
  PORT: "3000"
  WEB_PORT: "8080"

  # Public URL, no trailing slash. Without it the dashboard rejects logins.
  ORIGIN: "https://sc.change.me"

  # Only the dashboard talks to the API, and it does so from the loopback.
  TRUST_PROXY: "127.0.0.1"

  SEED_DEMO_DATA: "true"
  SEED_USER: "demo"
  SEED_PASSWORD: "demo-access-2024"

  DEVICE_TOKEN: "change-device-token"
  SESSION_SECRET: "change-secret-of-at-least-32-characters"

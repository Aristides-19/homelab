apiVersion: v1
kind: Pod
metadata:
  name: sc
spec:
  containers:
    - name: app
      # Demo image: it seeds a sample user and session on first start.
      image: ghcr.io/centro-mundo-x/sc-dashboard:latest
      envFrom:
        - configMapRef:
            name: env
      ports:
        # The dashboard only. The API stays internal on PORT 3000.
        - containerPort: 8080
          hostPort: 8080
      # The image has no curl, so httpGet would always fail. node is present.
      livenessProbe:
        exec:
          command:
            - node
            - -e
            - fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
        initialDelaySeconds: 30
        periodSeconds: 30
        failureThreshold: 5
      volumeMounts:
        - name: data
          mountPath: /app/data

  volumes:
    - name: data
      hostPath:
        path: /data/sc/data
        type: DirectoryOrCreate
